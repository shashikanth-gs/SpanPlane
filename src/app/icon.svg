<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8" />
      <stop offset="1" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Dynamic Theme Styles -->
  <style>
    /* Default (Dark Mode) */
    .bg { fill: #0f172a; }
    .dog-head { fill: #f8fafc; }
    .dog-ear-inner { fill: #cbd5e1; }
    .dog-muzzle { fill: #e2e8f0; }
    .dog-nose { fill: #0f172a; stroke: #0f172a; }
    .dog-smile { stroke: #0f172a; }

    /* Light Mode */
    @media (prefers-color-scheme: light) {
      .bg { fill: #f8fafc; }
      .dog-head { fill: #1e293b; }
      .dog-ear-inner { fill: #334155; }
      .dog-muzzle { fill: #475569; }
      .dog-nose { fill: #f8fafc; stroke: #f8fafc; }
      .dog-smile { stroke: #f8fafc; }
    }
  </style>

  <!-- Agent Antenna WiFi Waves -->
  <path d="M 28 12 Q 32 8 36 12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 24 8 Q 32 2 40 8" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Antenna Pole & Bulb -->
  <rect x="31" y="16" width="2" height="12" fill="#94a3b8" />
  <circle cx="32" cy="16" r="2.5" fill="#38bdf8" />

  <!-- Left Ear -->
  <path d="M 18 36 L 14 18 Q 24 18 28 28 Z" class="dog-head"/>
  <path d="M 19 34 L 16 22 Q 23 22 26 28 Z" class="dog-ear-inner"/>

  <!-- Right Ear -->
  <path d="M 46 36 L 50 18 Q 40 18 36 28 Z" class="dog-head"/>
  <path d="M 45 34 L 48 22 Q 41 22 38 28 Z" class="dog-ear-inner"/>

  <!-- Dog Head (Rounded rectangle face) -->
  <rect x="16" y="28" width="32" height="28" rx="14" class="dog-head" />

  <!-- Cyberpunk Visor -->
  <rect x="20" y="32" width="24" height="8" rx="4" fill="url(#neon)" />
  <rect x="22" y="34" width="20" height="4" rx="2" fill="#ffffff" opacity="0.8" />

  <!-- Dog Muzzle/Snout -->
  <ellipse cx="32" cy="46" rx="10" ry="7" class="dog-muzzle" />

  <!-- Dog Nose -->
  <path d="M 29 43 H 35 L 32 47 Z" class="dog-nose" stroke-linejoin="round" stroke-width="2" />

  <!-- Smile / Mouth -->
  <path d="M 30 49 Q 32 51 34 49" fill="none" class="dog-smile" stroke-width="1.5" stroke-linecap="round"/>

</svg>
